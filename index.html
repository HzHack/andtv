<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكتبة برامج Android TV | أبو عساف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e16; --panel:#121826; --panel-2:#182135;
  --line:rgba(255,255,255,.09); --text:#f4f6fb; --muted:#9aa6bb;
  --amber:#ffb84a; --focus:#ffffff;
  --safe-x:clamp(20px,4.5vw,84px); --safe-y:clamp(16px,3.5vh,56px);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-padding-top:150px;scroll-padding-bottom:90px}
body{
  background:var(--bg); color:var(--text);
  font-family:'Tajawal',system-ui,sans-serif; font-size:clamp(16px,1.15vw,22px);
  min-height:100vh; padding:0 var(--safe-x) var(--safe-y);
  background-image:radial-gradient(1200px 500px at 85% -10%,rgba(255,184,74,.09),transparent 60%);
  background-attachment:fixed;
}
:focus{outline:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}

/* Header */
.top{
  position:sticky; top:0; z-index:20;
  padding:var(--safe-y) 0 18px;
  background:linear-gradient(var(--bg) 82%,transparent);
}
.bar{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.brand h1{font-size:clamp(24px,2.2vw,40px);font-weight:800;line-height:1.2}
.brand p{color:var(--muted);margin-top:4px}
.by{color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:10px 22px;border-radius:999px}
.by b{color:var(--amber)}

.tools{display:flex;gap:14px;margin-top:20px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 320px;max-width:460px}
.search input{
  width:100%;background:var(--panel);color:var(--text);
  border:2px solid var(--line);border-radius:14px;padding:14px 20px;
  font:inherit;transition:border-color .15s,background .15s;
}
.search input::placeholder{color:var(--muted)}
.search input:focus{border-color:var(--focus);background:var(--panel-2)}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{
  background:var(--panel);color:var(--muted);border:2px solid var(--line);
  border-radius:14px;padding:12px 22px;font:inherit;font-weight:700;cursor:pointer;
  display:flex;gap:10px;align-items:center;transition:transform .15s,background .15s,color .15s;
}
.chip small{font-family:'Chakra Petch',sans-serif;font-size:.8em;opacity:.7}
.chip[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:#1a1200}
.chip:focus-visible,.chip:hover{transform:scale(1.05);border-color:var(--focus)}
.count{margin-inline-start:auto;color:var(--muted)}

/* Grid */
.grid{
  display:grid;gap:clamp(16px,1.6vw,30px);
  grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));
  margin-top:10px;
}
.card{
  background:var(--panel);border:2px solid var(--line);border-radius:22px;
  padding:clamp(18px,1.6vw,28px);display:flex;flex-direction:column;gap:18px;
  transition:transform .18s ease,border-color .18s,background .18s,box-shadow .18s;
}
.card:focus-within{
  transform:scale(1.035);background:var(--panel-2);border-color:var(--focus);
  box-shadow:0 22px 50px rgba(0,0,0,.6);z-index:5;
}
.head{display:flex;align-items:center;gap:16px}
.icon{
  width:72px;height:72px;border-radius:18px;flex-shrink:0;overflow:hidden;
  background:rgba(255,255,255,.05);border:1px solid var(--line);
  display:grid;place-items:center;
}
.icon img{width:100%;height:100%;object-fit:cover}
.icon .fb{width:100%;height:100%;display:grid;place-items:center;font:700 18px 'Chakra Petch',sans-serif;color:#fff}
.meta{min-width:0}
.name{font-size:1.25em;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat{color:var(--amber);font-weight:700;font-size:.85em;margin-top:2px}

/* The code is the hero */
.code{
  direction:ltr;text-align:center;background:#06090f;border:1px solid var(--line);
  border-radius:16px;padding:14px 10px 12px;
}
.code span{display:block;color:var(--muted);font:600 .7em 'Chakra Petch',sans-serif;letter-spacing:.14em}
.code strong{
  display:block;margin-top:2px;color:var(--amber);
  font:700 clamp(30px,2.6vw,46px)/1.1 'Chakra Petch',monospace;letter-spacing:.08em;
}
.acts{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;margin-top:auto}
.btn{
  display:flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer;
  background:rgba(255,255,255,.06);color:var(--text);border:2px solid var(--line);
  border-radius:14px;padding:14px 0;font:inherit;font-weight:800;
  transition:transform .15s,background .15s,color .15s;
}
.btn.main{background:var(--amber);border-color:var(--amber);color:#1a1200}
.btn:focus-visible,.btn:hover{transform:scale(1.05);outline-color:var(--focus)}
.btn:not(.main):focus-visible,.btn:not(.main):hover{background:#fff;color:#000}

.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:70px 0;font-size:1.2em}

/* Footer + toast */
.foot{
  margin-top:44px;padding-top:20px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:.9em;
}
kbd{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:1px 9px;font-family:'Chakra Petch',sans-serif;color:var(--text)}
.toast{
  position:fixed;bottom:5vh;left:50%;transform:translate(-50%,30px);opacity:0;pointer-events:none;
  background:var(--amber);color:#1a1200;font-weight:800;font-size:1.15em;
  padding:16px 34px;border-radius:999px;box-shadow:0 12px 40px rgba(0,0,0,.6);
  transition:.22s;z-index:50;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:700px){
  .by{display:none}
  .count{margin:0}
  .top{position:static;background:none}
  html{scroll-padding-top:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="bar">
    <div class="brand">
      <h1>شاشتي Downloader Hub</h1>
      <p>افتح تطبيق Downloader على التلفاز وأدخل الكود لتحميل البرنامج</p>
    </div>
    <div class="by">إعداد وتطوير: <b>أبو عساف</b></div>
  </div>
  <div class="tools">
    <div class="search">
      <input id="q" type="search" placeholder="ابحث باسم التطبيق أو الكود" autocomplete="off" aria-label="بحث">
    </div>
    <div class="chips" id="chips" role="group" aria-label="التصنيفات"></div>
    <div class="count" id="count" aria-live="polite"></div>
  </div>
</header>

<main class="grid" id="grid"></main>

<footer class="foot">
  <div><kbd>▲ ▼ ◄ ►</kbd> تنقّل &nbsp; <kbd>OK</kbd> نسخ الكود</div>
  <div>جميع الحقوق محفوظة &copy; 2026 — <b>أبو عساف</b></div>
</footer>

<div class="toast" id="toast" role="status"></div>

<script>
let apps = [];

const $ = id => document.getElementById(id);
const grid = $('grid'), q = $('q'), chipsBox = $('chips'), toast = $('toast'), countEl = $('count');
let cat = 'الكل', term = '', timer;

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s).toLowerCase().replace(/[\u064B-\u065F]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي');

/* Category chips built from data, with counts */
function buildChips() {
  const cats = ['الكل', ...new Set(apps.map(a => a.category))];
  chipsBox.innerHTML = cats.map(c => {
    const n = c === 'الكل' ? apps.length : apps.filter(a => a.category === c).length;
    return `<button class="chip" data-cat="${esc(c)}" aria-pressed="${c === cat}">${esc(c)} <small>${n}</small></button>`;
  }).join('');
}

function render() {
  const t = norm(term);
  const list = apps.filter(a => (cat === 'الكل' || a.category === cat) && (norm(a.name).includes(t) || a.code.includes(t)));
  countEl.textContent = list.length + ' تطبيق';
  if (!list.length) { grid.innerHTML = '<div class="empty">لا توجد نتائج. جرّب اسمًا أو كودًا آخر.</div>'; return; }
  grid.innerHTML = list.map(a => {
    const url = a.customUrl || `https://go.aftvnews.com/${a.code}`;
    const fb = `<div class="fb" style="background:${a.color}">${esc(a.icon)}</div>`;
    return `
    <article class="card">
      <div class="head">
        <div class="icon">${a.img ? `<img src="${esc(a.img)}" alt="" loading="lazy" data-fb="${esc(a.icon)}|${esc(a.color)}">` : fb}</div>
        <div class="meta"><div class="name">${esc(a.name)}</div><div class="cat">${esc(a.category)}</div></div>
      </div>
      <div class="code"><span>DOWNLOADER CODE</span><strong>${esc(a.code)}</strong></div>
      <div class="acts">
        <button class="btn main" data-code="${esc(a.code)}">نسخ الكود</button>
        <a class="btn" href="${esc(url)}" target="_blank" rel="noopener noreferrer">فتح الرابط</a>
      </div>
    </article>`;
  }).join('');
}

/* Icon fallback (no inline JS in markup) */
grid.addEventListener('error', e => {
  const img = e.target; if (img.tagName !== 'IMG') return;
  const [txt, color] = img.dataset.fb.split('|');
  img.parentNode.innerHTML = `<div class="fb" style="background:${color}">${txt}</div>`;
}, true);

/* Copy */
function showToast(msg) {
  toast.textContent = msg; toast.classList.add('show');
  clearTimeout(timer); timer = setTimeout(() => toast.classList.remove('show'), 2200);
}
async function copyCode(code) {
  try {
    if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(code);
    else throw 0;
  } catch {
    const t = document.createElement('input'); t.value = code; document.body.appendChild(t);
    t.select(); try { document.execCommand('copy'); } catch {} t.remove();
  }
  showToast('تم نسخ الكود ' + code);
}
grid.addEventListener('click', e => {
  const b = e.target.closest('[data-code]'); if (b) copyCode(b.dataset.code);
});

chipsBox.addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  cat = b.dataset.cat;
  chipsBox.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === b));
  render();
});
q.addEventListener('input', () => { term = q.value.trim(); render(); });

/* D-pad / remote: move focus to the nearest control in the pressed direction */
const dirs = { ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0] };
document.addEventListener('keydown', e => {
  const d = dirs[e.key]; if (!d) return;
  const cur = document.activeElement;
  if (cur === q && d[1] === 0) return;            // keep caret movement in search box
  const items = [...document.querySelectorAll('#q,.chip,.btn')];
  if (!items.includes(cur)) { items[0].focus(); e.preventDefault(); return; }
  const c = cur.getBoundingClientRect(), cx = c.left + c.width/2, cy = c.top + c.height/2;
  let best = null, bestScore = Infinity;
  for (const el of items) {
    if (el === cur) continue;
    const r = el.getBoundingClientRect(), dx = r.left + r.width/2 - cx, dy = r.top + r.height/2 - cy;
    const along = dx*d[0] + dy*d[1];
    if (along <= 4) continue;
    const across = Math.abs(d[0] ? dy : dx);
    const score = along + across * 3;
    if (score < bestScore) { bestScore = score; best = el; }
  }
  if (best) { e.preventDefault(); best.focus(); best.scrollIntoView({block:'nearest'}); }
});

/* Load apps from apps.json (needs a web server, not file://) */
fetch('apps.json', {cache:'no-cache'})
  .then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(data => {
    apps = data; buildChips(); render();
    if (matchMedia('(min-width:701px)').matches) document.querySelector('.btn.main')?.focus({preventScroll:true});
  })
  .catch(() => {
    grid.innerHTML = '<div class="empty">تعذّر تحميل apps.json. تأكد أن الملف بجانب index.html وأن الصفحة تعمل من موقع (وليس بفتح الملف مباشرة).</div>';
  });
</script>
</body>
</html>
