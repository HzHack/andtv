<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة برامج Android TV | تطوير أبو عساف</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@700;800&family=Chakra+Petch:wght@700&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --tv-bg: #07090e;
            --tv-card: #101522;
            --tv-card-focus: #182032;
            --tv-border: rgba(255, 255, 255, 0.08);
            --tv-focus-border: #00f0ff;
            --tv-accent: #e9b44c;
            --tv-cyan: #00f0ff;
            --tv-text: #f8fafc;
            --tv-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none;
        }

        body {
            background-color: var(--tv-bg);
            color: var(--tv-text);
            font-family: 'Tajawal', sans-serif;
            min-height: 100vh;
            padding: 40px 60px;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 240, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(233, 180, 76, 0.04) 0%, transparent 40%);
            background-attachment: fixed;
        }

        /* Top TV HUD Bar */
        .tv-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 35px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--tv-border);
        }

        .tv-brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .tv-brand-badge {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 13px;
            background: rgba(0, 240, 255, 0.12);
            color: var(--tv-cyan);
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid rgba(0, 240, 255, 0.3);
            letter-spacing: 1px;
            font-weight: 700;
        }

        .tv-brand h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .tv-dev-tag {
            font-size: 16px;
            color: var(--tv-muted);
            background: var(--tv-card);
            padding: 10px 24px;
            border-radius: 50px;
            border: 1px solid var(--tv-border);
        }

        .tv-dev-tag strong {
            color: var(--tv-accent);
        }

        /* Search & TV D-Pad Friendly Filters */
        .tv-nav {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            flex: 1;
            max-width: 420px;
        }

        .search-box input {
            width: 100%;
            background: var(--tv-card);
            border: 2px solid var(--tv-border);
            color: #fff;
            padding: 14px 22px;
            border-radius: 14px;
            font-family: inherit;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        .search-box input:focus {
            border-color: var(--tv-focus-border);
            background: var(--tv-card-focus);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.25);
        }

        .filter-row {
            display: flex;
            gap: 12px;
        }

        .tv-btn {
            background: var(--tv-card);
            border: 2px solid var(--tv-border);
            color: var(--tv-muted);
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            padding: 12px 28px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tv-btn:hover,
        .tv-btn:focus,
        .tv-btn.active {
            background: #fff;
            color: #000;
            border-color: #fff;
            transform: scale(1.04);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .tv-btn.active:focus {
            box-shadow: 0 0 25px var(--tv-focus-border);
            border-color: var(--tv-focus-border);
            background: var(--tv-cyan);
            color: #000;
        }

        /* High-Visibility 10ft Grid */
        .tv-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 26px;
            margin-bottom: 50px;
        }

        .tv-card {
            background: linear-gradient(180deg, var(--tv-card) 0%, #0c101a 100%);
            border: 2px solid var(--tv-border);
            border-radius: 20px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        /* Remote control focus indicator */
        .tv-card:focus-within,
        .tv-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--tv-focus-border);
            background: linear-gradient(180deg, var(--tv-card-focus) 0%, #111726 100%);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 240, 255, 0.25);
            z-index: 10;
        }

        .card-head {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 20px;
        }

        .app-icon-box {
            width: 68px;
            height: 68px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--tv-border);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.5);
        }

        .app-icon-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .app-icon-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 800;
            color: #fff;
            font-family: 'Chakra Petch', sans-serif;
        }

        .app-info {
            flex: 1;
            overflow: hidden;
        }

        .app-title {
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .app-cat {
            font-size: 13px;
            color: var(--tv-accent);
            font-weight: 700;
            margin-top: 4px;
        }

        /* Large TV Downloader Code Display */
        .code-display {
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid var(--tv-border);
            border-radius: 14px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            direction: ltr;
        }

        .code-title {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 12px;
            letter-spacing: 1px;
            color: var(--tv-muted);
            font-weight: 700;
        }

        .code-number {
            font-family: 'Chakra Petch', monospace;
            font-size: 26px;
            font-weight: 700;
            color: var(--tv-cyan);
            letter-spacing: 2px;
            text-shadow: 0 0 14px rgba(0, 240, 255, 0.35);
        }

        /* Action Buttons for Remote */
        .card-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--tv-border);
            color: var(--tv-text);
            padding: 12px 0;
            border-radius: 12px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .action-btn:focus,
        .action-btn:hover {
            background: var(--tv-focus-border);
            color: #000;
            border-color: var(--tv-focus-border);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
            transform: scale(1.03);
        }

        .action-btn.btn-dl:focus,
        .action-btn.btn-dl:hover {
            background: var(--tv-accent);
            border-color: var(--tv-accent);
            box-shadow: 0 0 20px rgba(233, 180, 76, 0.4);
            color: #000;
        }

        /* TV Remote Hints */
        .remote-bar {
            background: var(--tv-card);
            border: 1px solid var(--tv-border);
            border-radius: 16px;
            padding: 16px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--tv-muted);
            font-size: 14px;
        }

        .remote-hints {
            display: flex;
            gap: 20px;
        }

        .hint-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .key-badge {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-family: monospace;
        }

        /* Toast */
        .tv-toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(30px);
            background: #000;
            border: 2px solid var(--tv-cyan);
            color: #fff;
            padding: 16px 36px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 800;
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.5);
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s ease;
            z-index: 1000;
        }

        .tv-toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 800px) {
            body { padding: 24px 16px; }
            .tv-topbar { flex-direction: column; align-items: stretch; text-align: center; }
            .tv-brand { justify-content: center; }
            .search-box { max-width: 100%; }
            .tv-grid { grid-template-columns: 1fr; }
            .remote-bar { flex-direction: column; gap: 10px; text-align: center; }
        }
    </style>
</head>
<body>

    <!-- TV Top Bar -->
    <header class="tv-topbar">
        <div class="tv-brand">
            <span class="tv-brand-badge">TV EDITION</span>
            <h1>شاشتي Downloader Hub</h1>
        </div>
        <div class="tv-dev-tag">
            إعداد وتطوير: <strong>أبو عساف</strong>
        </div>
    </header>

    <!-- TV Remote Controls & Filters -->
    <div class="tv-nav">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث باسم التطبيق أو الكود..." tabindex="1">
        </div>
        <div class="filter-row">
            <button class="tv-btn active" data-filter="all" tabindex="2">الكل</button>
            <button class="tv-btn" data-filter="بث وميديا" tabindex="3">بث وميديا</button>
            <button class="tv-btn" data-filter="رياضة" tabindex="4">رياضة</button>
        </div>
    </div>

    <!-- App Grid -->
    <main class="tv-grid" id="appsGrid"></main>

    <!-- TV Remote Control Footer Guide -->
    <footer class="remote-bar">
        <div class="remote-hints">
            <div class="hint-item"><span class="key-badge">▲ ▼ ◄ ►</span> التنقل بالريموت</div>
            <div class="hint-item"><span class="key-badge">OK</span> تحديد / نسخ</div>
        </div>
        <div>جميع الحقوق محفوظة &copy; 2026 — <strong>أبو عساف</strong></div>
    </footer>

    <!-- TV Large Toast -->
    <div class="tv-toast" id="toast">✅ تم نسخ الكود للشاشة</div>

<script>
    const apps = [
        { name: 'dukket TV', icon: 'DUK', img: 'icons/dukket TV.png', code: '9260213', category: 'بث وميديا', color: '#1e293b' },
        { name: 'FalconTV', icon: 'FLC', img: 'icons/FalconTV.png', code: '2571211', category: 'بث وميديا', color: '#854d0e' },
        { name: 'FLAW TV', icon: 'FLW', img: 'icons/FLAW TV.png', code: '2254595', category: 'بث وميديا', color: '#581c87' },
        { name: 'GeeSport', icon: 'GEE', img: 'icons/GeeSport.png', code: '7626034', category: 'رياضة', color: '#14532d' },
        { name: 'GnulaTV', icon: 'GNU', img: 'icons/GnulaTV.png', code: '7401292', category: 'بث وميديا', color: '#1e3a8a' },
        { name: 'infiniti', icon: 'INF', img: 'icons/infiniti.png', code: '5767569', category: 'بث وميديا', color: '#334155' },
        { name: 'Netflix', icon: 'NFLX', img: 'icons/Netflix.png', code: '8501748', category: 'بث وميديا', color: '#7f1d1d' },
        { name: 'SHARK TV', icon: 'SHK', img: 'icons/SHARK TV.png', code: '9925167', category: 'بث وميديا', color: '#78350f' },
        { name: 'YouTube TBOX', icon: 'YTB', img: 'icons/YouTube TBOX.png', code: '3245548', category: 'بث وميديا', color: '#991b1b' },
        { name: 'Xuper TV ALL', icon: 'XPR', img: 'icons/Xuper TV ALL.png', code: '2545714', category: 'بث وميديا', color: '#064e3b' },
        { name: 'Sportz', icon: 'SPZ', img: 'icons/Sportz.png', code: '6391886', category: 'رياضة', color: '#991b1b' },
        { name: 'Xuper TV v6', icon: 'XP6', img: 'icons/Xuper-TV-v6.png', code: '6951500', category: 'بث وميديا', color: '#1e293b' },
        { name: 'Disney Plus ES', icon: 'DIS', img: 'icons/Disney Plus ES.png', code: '7045861', category: 'بث وميديا', color: '#172554' }
    ];

    const grid = document.getElementById('appsGrid');
    const searchInput = document.getElementById('searchInput');
    const filterBtns = document.querySelectorAll('.tv-btn');
    const toast = document.getElementById('toast');

    let currentFilter = 'all';
    let searchText = '';
    let toastTimer = null;

    function render() {
        const filtered = apps.filter(app => {
            const matchCat = (currentFilter === 'all' || app.category === currentFilter);
            const matchSearch = app.name.toLowerCase().includes(searchText) || app.code.includes(searchText);
            return matchCat && matchSearch;
        });

        let tabCounter = 10;

        grid.innerHTML = filtered.map(app => {
            const copyTab = tabCounter++;
            const dlTab = tabCounter++;
            const iconHtml = app.img ? 
                `<img src="${app.img}" alt="${app.name}" onerror="this.outerHTML='<div class=\\'app-icon-fallback\\' style=\\'background:${app.color}\\'>${app.icon}</div>'">` : 
                `<div class="app-icon-fallback" style="background:${app.color}">${app.icon}</div>`;

            return `
            <div class="tv-card">
                <div>
                    <div class="card-head">
                        <div class="app-icon-box">
                            ${iconHtml}
                        </div>
                        <div class="app-info">
                            <div class="app-title">${app.name}</div>
                            <div class="app-cat">${app.category}</div>
                        </div>
                    </div>

                    <div class="code-display">
                        <span class="code-title">DOWNLOADER</span>
                        <span class="code-number">${app.code}</span>
                    </div>
                </div>

                <div class="card-actions">
                    <button class="action-btn" data-code="${app.code}" tabindex="${copyTab}">
                        نسخ الكود
                    </button>
                    <a href="https://go.aftvnews.com/${app.code}" target="_blank" rel="noopener noreferrer" class="action-btn btn-dl" tabindex="${dlTab}">
                        فتح الرابط
                    </a>
                </div>
            </div>
            `;
        }).join('');

        document.querySelectorAll('.action-btn[data-code]').forEach(btn => {
            btn.onclick = function() {
                const code = this.dataset.code;
                copyCode(code);
            };
        });
    }

    function copyCode(code) {
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(code).then(() => showToast(code));
        } else {
            const temp = document.createElement('input');
            temp.value = code;
            document.body.appendChild(temp);
            temp.select();
            document.execCommand('copy');
            document.body.removeChild(temp);
            showToast(code);
        }
    }

    function showToast(code) {
        toast.textContent = '✅ تم نسخ الكود: ' + code;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    searchInput.addEventListener('input', (e) => {
        searchText = e.target.value.trim().toLowerCase();
        render();
    });

    filterBtns.forEach(btn => {
        btn.addEventListener('click', function() {
            filterBtns.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentFilter = this.dataset.filter;
            render();
        });
    });

    render();
</script>
</body>
</html>
